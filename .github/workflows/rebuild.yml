# NOT "nightly", and the name is the point. The homepage's next-service card
# falls back to its build-time value when JavaScript does not run, so the
# rebuild interval IS the worst-case staleness a no-JS visitor sees. Four builds
# a day bounds that at six hours; one a day would bound it at twenty-four.
name: Reconstruire la fiecare șase ore

on:
  schedule:
    # 01:00, 07:00, 13:00 and 19:00 UTC — 03:00/09:00/15:00/21:00 in Zürich
    # during summer time, an hour earlier in winter. Nothing depends on the
    # exact hours; what matters is that one of them falls after midnight, so the
    # date the pages were built with rolls over.
    #
    # About 120 of Cloudflare Pages' 500 free builds a month.
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruieste:
    runs-on: ubuntu-latest
    steps:
      # The secret is checked by name first. `curl -X POST ""` fails too, but it
      # fails with a usage message about a URL, which is not what a person
      # reading a red build at 03:00 needs to see.
      - name: Declanșează build-ul Cloudflare Pages
        env:
          CARLIG: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$CARLIG" ]; then
            echo "Secretul CF_DEPLOY_HOOK nu este configurat."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Valoarea este URL-ul deploy hook-ului din Cloudflare Pages"
            echo "(Settings -> Builds & deployments -> Deploy hooks)."
            exit 1
          fi
          # -f so an HTTP error is a failed job rather than a silent success:
          # without it curl prints the error body and exits 0, and a rebuild
          # that stopped happening would look exactly like one that works.
          curl -fsS -X POST "$CARLIG"

      # GitHub runs `schedule` triggers ONLY from the repository's default
      # branch. A rebuild.yml living anywhere else therefore never fires - no
      # red build, no log line, nothing - and the six-hour bound on how stale
      # the no-JS "next service" card can get silently becomes "until somebody
      # publishes". This step is the only thing that can say so out loud.
      #
      # AFTER THE curl, NOT BEFORE, and the order is deliberate: whatever this
      # step decides, the rebuild that was asked for has already been triggered.
      # A guard about branch configuration must not be able to stop the thing it
      # exists to protect.
      #
      # HONEST SCOPE: on a scheduled run the two names are equal by
      # construction, so this can only fire on a manual dispatch. That is the
      # case worth catching - step E3 of `docs/handover.md` has somebody press
      # "Run workflow" precisely to confirm the rebuild works, and a green run
      # from the wrong branch is the false reassurance that ends the enquiry.
      - name: Programarea funcționează doar din ramura implicită
        env:
          RAMURA: ${{ github.ref_name }}
          IMPLICITA: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RAMURA" = "$IMPLICITA" ]; then
            echo "Ramura '$RAMURA' este ramura implicită a depozitului."
            exit 0
          fi
          echo "Reconstrucția a fost cerută, dar PROGRAMAREA NU VA RULA DE AICI."
          echo
          echo "Ramura curentă:  '$RAMURA'"
          echo "Ramura implicită: '$IMPLICITA'"
          echo
          echo "GitHub declanșează 'schedule' numai din ramura implicită, deci din"
          echo "'$RAMURA' reconstrucția la fiecare șase ore nu s-ar întâmpla niciodată,"
          echo "iar cartonașul 'Următoarea slujbă' fără JavaScript ar rămâne vechi"
          echo "până când publică cineva ceva. Nimic nu ar semnala asta."
          echo
          echo "Fă din '$RAMURA' ramura implicită, sau lucrează din '$IMPLICITA'."
          echo "Vezi pasul A1 din docs/handover.md."
          exit 1
